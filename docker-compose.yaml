services:
  postgres:
    image: postgres:16-alpine
    container_name: feeldown-postgres
    environment:
      POSTGRES_USER: feeldown
      POSTGRES_PASSWORD: feeldownpass
      POSTGRES_DB: feeldown
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feeldown -d feeldown"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: dockerfile
      args:
        - DATABASE_URL=postgresql://feeldown:feeldownpass@postgres:5432/feeldown
    container_name: feeldown-backend
    environment:
      - DATABASE_URL=postgresql://feeldown:feeldownpass@postgres:5432/feeldown
      - SESSION_SECRET=${SESSION_SECRET}
      - HASH_KEY=${HASH_KEY}
      - CLIENT_URL=${CLIENT_URL}
      - CALLBACK_URL=${CALLBACK_URL}
      - TOKEN_EXPIRATION=${TOKEN_EXPIRATION}
      - ENCODING_TYPE=${ENCODING_TYPE}
      - CACHE_TIME_TO_LIVE_IN_MILLISECONDS=${CACHE_TIME_TO_LIVE_IN_MILLISECONDS}
      - THROTTLER_TIME_TO_LIVE_IN_MILLISECONDS=${THROTTLER_TIME_TO_LIVE_IN_MILLISECONDS}
      - THROTTLER_LIMIT=${THROTTLER_LIMIT}
      - PORT=${PORT:-8080}
      - PROGRAM_MODE=production
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
